<html lang="zh-TW">

<title>高雄市派報進度追蹤</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:#f5f5f0;color:#1a1a18;min-height:100vh;padding:16px}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.updated{font-size:12px;color:#aaa;margin-bottom:14px}
.hero{background:#fff;border:1px solid #e8e6df;border-radius:14px;padding:20px;margin-bottom:14px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.hstat{text-align:center;padding:8px 4px}
.hstat .lbl{font-size:11px;color:#888;margin-bottom:4px;letter-spacing:.04em}
.hstat .val{font-size:30px;font-weight:700;line-height:1}
.hstat .sub{font-size:11px;color:#888;margin-top:3px}
.pbar{height:12px;background:#eee;border-radius:6px;overflow:hidden}
.pbar-fill{height:100%;background:#2d7dd2;border-radius:6px;transition:width .6s}
.pbar-lbl{font-size:12px;color:#888;text-align:right;margin-top:4px}
.stitle{font-size:14px;font-weight:600;margin-bottom:10px;color:#333}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;margin-bottom:18px}
.zcard{background:#fff;border:1px solid #e8e6df;border-radius:10px;padding:12px 14px}
.zcard.done{opacity:.4}
.zcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.zid{font-size:11px;color:#888}
.zbadge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.zbadge.ns{background:#f0efe8;color:#777}
.zbadge.wip{background:#fff3e0;color:#b26a00}
.zbadge.db{background:#e8f5e9;color:#2e7d32}
.zdists{font-size:11px;color:#888;margin-bottom:5px;line-height:1.5}
.zshares{font-size:15px;font-weight:700}
.ns-c{color:#b26a00}.wip-c{color:#1565c0}.done-c{color:#2e7d32}
.zmini{font-size:10px;color:#aaa;margin-top:2px}
.zpct{width:100%;height:5px;background:#eee;border-radius:3px;margin-top:7px;overflow:hidden}
.zpct-f{height:100%;background:#2d7dd2;border-radius:3px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:6px 13px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;cursor:pointer;transition:all .15s}
.tab:hover{background:#f5f5f0}
.tab.on{background:#2d7dd2;color:#fff;border-color:#2d7dd2;font-weight:500}
.dmet{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.dm{background:#fff;border:1px solid #e8e6df;border-radius:10px;padding:10px 12px}
.dml{font-size:11px;color:#888;margin-bottom:2px}
.dmv{font-size:20px;font-weight:700}
.dsec{margin-bottom:10px;background:#fff;border:1px solid #e8e6df;border-radius:10px;padding:10px 12px}
.dn{font-size:11px;font-weight:600;color:#888;margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.cn{background:#e3f0fc;color:#1565c0}
.cc{background:#fce3e3;color:#7f1d1d;text-decoration:line-through;opacity:.6}
.cw{background:#e8f5e9;color:#1b5e20}
.cr{background:#fff3e0;color:#b26a00}
.cu{background:#f0efe8;color:#555;opacity:.7}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:4px;font-size:12px;color:#666}
.ld{width:8px;height:8px;border-radius:50%}
.footer{margin-top:16px;padding:12px 14px;background:#fff;border:1px solid #e8e6df;border-radius:10px;font-size:12px;color:#888;display:flex;gap:8px;align-items:flex-start}
.note{font-size:10px;color:#aaa;margin-top:6px}
@media(max-width:520px){.hero-grid{grid-template-columns:1fr 1fr}.hstat:last-child{grid-column:span 2}.hstat .val{font-size:22px}}

function n(x){return typeof x==='string'?{t:'normal',v:x}:x;}
function fmt(v){return Math.round(v).toLocaleString();}

function calcTotals(){
  const seen=new Set();let tot=0;const dd={};
  for(const dayData of Object.values(RAW)){
    for(const [sd,items] of Object.entries(dayData)){
      const pa=PA[sd]||0,d=SD2D[sd]||sd;
      for(const raw of items){
        const{t,v}=n(raw);
        if(t==='cancelled'||t==='reserve'||t==='undel') continue;
        const k=sd+':'+v;
        if(!seen.has(k)){seen.add(k);tot+=pa;dd[d]=(dd[d]||0)+pa;}
      }
    }
  }
  return{tot:Math.round(tot),dd};
}

function calcDay(dayData){
  let areas=0,cancel=0,shares=0,newC=0;
  for(const[sd,items]of Object.entries(dayData)){
    const pa=PA[sd]||0;
    for(const raw of items){
      const{t}=n(raw);
      if(t==='cancelled'){cancel++;continue;}
      if(t==='reserve'||t==='undel') continue;
      areas++;shares+=pa;if(t==='new') newC++;
    }
  }
  return{areas,cancel,shares:Math.round(shares),newC};
}

function chipClass(t){return t==='cancelled'?'cc':t==='new'?'cw':t==='reserve'?'cr':t==='undel'?'cu':'cn';}

    <div class="zshares ${st==='done'?'done-c':st==='wip'?'wip-c':'ns-c'}">${st==='done'?'✓ '+fmt(z.total):st==='wip'?fmt(zd)+' / '+fmt(z.total):fmt(z.total)} 份</div>
    ${st==='wip'?`<div class="zmini">尚餘 ${fmt(z.total-zd)} 份</div>`:''}
    <div class="zpct"><div class="zpct-f" style="width:${pz}%"></div></div>
  </div>`;
}).join('');

const days=Object.keys(RAW);
let active=days[days.length-1];

function renderDay(){
  document.getElementById('tabs').innerHTML=days.map(d=>
    `<button class="tab${d===active?' on':''}" onclick="setDay('${d}')">${d}</button>`
  ).join('');
  const dd=RAW[active];
  const{areas,cancel,shares,newC}=calcDay(dd);
  document.getElementById('dmet').innerHTML=`
    <div class="dm"><div class="dml">今日派出份數</div><div class="dmv" style="color:#1565c0">${fmt(shares)}</div></div>
    <div class="dm"><div class="dml">派出區域</div><div class="dmv">${areas}</div></div>
    <div class="dm"><div class="dml">涵蓋行政區</div><div class="dmv">${Object.keys(dd).length}</div></div>
    <div class="dm"><div class="dml">取消/未派</div><div class="dmv" style="${cancel>0?'color:#c62828':''}">${cancel}</div></div>
  `;
  document.getElementById('dareas').innerHTML=Object.entries(dd).map(([sd,items])=>`
    <div class="dsec"><div class="dn">${sd}</div><div class="chips">
      ${items.map(r=>{const{t,v}=n(r);return`<span class="chip ${chipClass(t)}">${v}</span>`;}).join('')}
    </div></div>
  `).join('');
}
window.setDay=d=>{active=d;renderDay();};
renderDay();
</script>
</body>
</html>
